<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>The Bushi Show</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{background:#08080d;color:#a7a294;font-family:Inter,sans-serif;user-select:none;-webkit-user-select:none}
  /* home finta */
  .nav{padding:18px;text-align:center}.nav a{color:#a7a294;margin:0 10px;text-decoration:none}
  .hero{height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .h{font-family:'Playfair Display',serif;color:#d4af37;font-size:32px}
  .sec{padding:30px 20px;text-align:center;border-top:1px solid #1a1a24;color:#8a8578}

  #enable{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    padding:13px 22px;border:1px solid #d4af3766;background:#16141c;color:#f0d97a;border-radius:12px;
    font-family:'Playfair Display',serif;font-size:16px;z-index:50}
  #layer{position:fixed;inset:0;z-index:40;pointer-events:none;perspective:1300px;display:none}
  #layer.on{display:block}
  #shadow{position:absolute;left:0;top:0;width:min(360px,86vw);aspect-ratio:239/335;
    border-radius:18px;background:#000;filter:blur(34px);opacity:.5;pointer-events:none}
  #card{position:absolute;left:0;top:0;width:min(360px,86vw);aspect-ratio:239/335;
    transform-style:preserve-3d;pointer-events:auto;touch-action:none;will-change:transform;}
  #cardinner{position:absolute;inset:0;border-radius:16px;overflow:hidden;transform-style:preserve-3d;background:transparent}
  #card img{width:100%;height:100%;display:block;object-fit:contain}
  /* riflesso lucido molto sottile, solo con l'inclinazione */
  #glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;border-radius:13px;opacity:.45;
    background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.28) 50%,rgba(255,255,255,0) 60%);
    background-size:300% 300%;background-position:50% 50%}
  #flash{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 46%,#fff,rgba(255,255,255,0) 60%);
    opacity:0;pointer-events:none}
  #tip{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;
    font-family:'Playfair Display',serif;color:#f0d97a;font-size:15px;opacity:0;transition:opacity .8s;z-index:60}
  #tip.on{opacity:.85}
</style>
</head>
<body>
<div class="nav"><a>Home</a><a>Show</a><a>Gallery</a><a>Contact</a></div>
<div class="hero"><div class="h">The Bushi Show</div><p>Father &amp; Son · Magic &amp; Mentalism</p>
  <p style="font-size:12px;opacity:.5;margin-top:8px">prova carta interattiva</p></div>
<div class="sec">As seen on Rai 1</div>

<button id="enable">✦ Preparati</button>
<div id="flash"></div>
<div id="layer"><div id="shadow"></div><div id="card"><div id="cardinner"><img id="cardimg" alt=""><div id="glare"></div></div></div></div>
<div id="tip"></div>

<script>
(function(){
  var EP="https://svvylcewvscbgwukwzdh.supabase.co/functions/v1/site?profile=dash";
  var CARDS="https://svvylcewvscbgwukwzdh.supabase.co/storage/v1/object/public/thumbs/cards-photo/";
  var EXT=".png";
  var enable=document.getElementById('enable'),layer=document.getElementById('layer'),
      card=document.getElementById('card'),img=document.getElementById('cardimg'),
      glare=document.getElementById('glare'),tip=document.getElementById('tip'),
      shadow=document.getElementById('shadow'),cardinner=document.getElementById('cardinner'),
      flash=document.getElementById('flash');
  var pending=null,shown=false,ready=false,done=false;
  var dragX=0,dragY=0, dragging=false, gone=false, flung=false, flingRot=0;
  var vx=0,vy=0,lastX=0,lastY=0,lastT=0, gGamma=0,gBeta=40;

  function poll(){fetch(EP,{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    var code=j&&j.card&&/^(10|[2-9]|[AJQK])[SHDC]$/.test(j.card)?j.card:null;
    pending=code; if(code)img.src=CARDS+code+EXT;
  }).catch(function(){});}

  function onOrient(e){
    if(!shown)return;
    gGamma=e.gamma||0;      // sinistra-destra
    gBeta =e.beta||40;      // avanti-indietro (~40 quando tieni il telefono normale)
  }
  function onMotion(e){
    if(shown||done||!pending)return;
    var a=e.acceleration;   // accelerazione NETTA (senza gravità): ~0 a riposo, picco sul colpo
    if(a && (a.x!=null||a.y!=null||a.z!=null)){
      var m=Math.sqrt((a.x||0)*(a.x||0)+(a.y||0)*(a.y||0)+(a.z||0)*(a.z||0));
      if(m>19){appear();}          // solo uno SBATTIMENTO deciso
    }else{
      var g=e.accelerationIncludingGravity||{};
      var mg=Math.sqrt((g.x||0)*(g.x||0)+(g.y||0)*(g.y||0)+(g.z||0)*(g.z||0));
      if(mg>32){appear();}         // fallback (con gravità): soglia alta
    }
  }
  var DEAD=14;   // inclinazione DECISA: sotto questa soglia la carta resta ferma
  function loop(){
    requestAnimationFrame(loop);
    if(!shown)return;
    var cw=card.offsetWidth||300, ch=card.offsetHeight||420;
    var baseX=(window.innerWidth-cw)/2, baseY=window.innerHeight*0.46-ch/2;
    var minX=-baseX, maxX=window.innerWidth-cw-baseX;
    var minY=-baseY, maxY=window.innerHeight-ch-baseY;
    if(!dragging && !flung){
      // solo se inclini DECISO (oltre la zona morta) la carta scivola
      var gx=gGamma, gy=gBeta-40;
      var ax=Math.abs(gx)>DEAD ? Math.max(-40,Math.min(40,gx-Math.sign(gx)*DEAD)) : 0;
      var ay=Math.abs(gy)>DEAD ? Math.max(-40,Math.min(40,gy-Math.sign(gy)*DEAD)) : 0;
      vx+=ax*0.07; vy+=ay*0.07;
      vx*=0.85; vy*=0.85;
      if(!ax && Math.abs(vx)<0.15) vx=0;
      if(!ay && Math.abs(vy)<0.15) vy=0;
      dragX+=vx; dragY+=vy;
      if(dragX<minX){dragX=minX;vx=0;} if(dragX>maxX){dragX=maxX;vx=0;}
      if(dragY<minY){dragY=minY;vy=0;} if(dragY>maxY){dragY=maxY;vy=0;}
    }else if(flung){
      dragX+=vx; dragY+=vy; vx*=0.99; vy*=0.99; flingRot+=vx*0.5;
      if(baseX+dragX< -cw*1.2 || baseX+dragX>window.innerWidth+cw*0.2 ||
         baseY+dragY< -ch*1.2 || baseY+dragY>window.innerHeight+ch*0.2){dismiss();}
    }
    card.style.transform='translate('+(baseX+dragX)+'px,'+(baseY+dragY)+'px)'+(flung?' rotate('+flingRot+'deg)':'');
    glare.style.backgroundPosition=(50-gGamma*1.2)+'% '+(50+(gBeta-40)*1.2)+'%';
    shadow.style.transform='translate('+(baseX+dragX)+'px,'+(baseY+dragY+18)+'px)';
  }

  function appear(){
    if(shown||done)return;shown=true;layer.classList.add('on');
    // FLASH d'impatto
    flash.animate([{opacity:0},{opacity:.85,offset:.12},{opacity:0}],{duration:340,easing:'ease-out'});
    // scossa breve dello schermo (il colpo)
    layer.animate([{transform:'translateY(0)'},{transform:'translateY(9px)'},{transform:'translateY(-4px)'},{transform:'translateY(0)'}],{duration:240,easing:'ease-out'});
    // la carta viene SCAGLIATA DENTRO: dalla profondità → slam al centro con rimbalzo
    cardinner.animate([
      {opacity:0,transform:'translateY(-70px) scale(.18) rotate(-8deg)'},
      {opacity:1,offset:.55,transform:'translateY(8px) scale(1.14) rotate(2deg)'},
      {opacity:1,transform:'translateY(0) scale(1) rotate(0)'}
    ],{duration:560,easing:'cubic-bezier(.2,1.35,.35,1)'});
    tip.textContent='Muovi il telefono… poi trascìnala via';tip.classList.add('on');
    setTimeout(function(){tip.classList.remove('on');},4500);
    if(navigator.vibrate)navigator.vibrate([60,25,140]);
  }
  function dismiss(){
    if(gone)return;gone=true;done=true;   // consumata: non riappare più (serve ri-armare + ricaricare)
    var dir=dragX>=0?1:-1;
    card.animate([{transform:card.style.transform},{transform:'translate('+(dir*window.innerWidth)+'px,'+(dragY-200)+'px) rotate('+(dir*40)+'deg)',opacity:0}],{duration:420,easing:'ease-in'});
    setTimeout(function(){layer.classList.remove('on');shown=false;
      enable.style.display='';enable.textContent='↻ Nuovo trucco';enable.onclick=function(){location.reload();};},420);
  }

  // trascinamento
  card.addEventListener('pointerdown',function(e){dragging=true;flung=false;card.setPointerCapture(e.pointerId);
    lastX=e.clientX;lastY=e.clientY;vx=vy=0;});
  card.addEventListener('pointermove',function(e){if(!dragging)return;
    var mx=e.clientX-lastX,my=e.clientY-lastY;
    dragX+=mx;dragY+=my;
    vx=vx*0.35+mx*0.65; vy=vy*0.35+my*0.65;     // velocità smussata (movimento fluido)
    lastX=e.clientX;lastY=e.clientY;});
  card.addEventListener('pointerup',function(){dragging=false;
    // strappo deciso → la carta vola fuori
    if(Math.hypot(vx,vy)>10){flung=true; vx*=2.6; vy*=2.6;} });
  card.addEventListener('pointercancel',function(){dragging=false;});

  function start(){
    ready=true;enable.style.display='none';
    poll();setInterval(function(){if(!shown&&!done)poll();},2500);
    window.addEventListener('deviceorientation',onOrient);
    window.addEventListener('devicemotion',onMotion);
    requestAnimationFrame(loop);
    // NIENTE auto-avvio: la carta appare SOLO con lo sbattimento (onMotion)
  }
  enable.onclick=function(){
    var need=(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function');
    if(need){DeviceOrientationEvent.requestPermission().then(function(s){
      if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){DeviceMotionEvent.requestPermission().catch(function(){});}
      start();
    }).catch(start);} else start();
  };
})();
</script>
</body>
</html>
